name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests, linter, retrieval and verifier evals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      # The test suite seeds ChromaDB, whose default embedding function
      # downloads the all-MiniLM-L6-v2 ONNX model (~80MB) to
      # ~/.cache/chroma/onnx_models/ on first use. Without this the download
      # happens on every run; the model is a fixed artifact, so a hit makes
      # the seeding step purely local.
      - name: Cache ChromaDB embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          # Keyed on the lock file so a chromadb upgrade that changes the
          # bundled model name re-downloads, with a fallback to any existing
          # cache since the model rarely changes between versions.
          key: chroma-model-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            chroma-model-${{ runner.os }}-

      # Gate: the suite must pass.
      - name: Run pytest
        run: uv run pytest -q

      # Gate: the main golden set must stay at or above F1 0.95. The linter
      # currently scores 1.00 there, so this catches a real regression while
      # leaving room for a single borderline case.
      - name: Run linter eval -- main set (gated at F1 0.95)
        id: eval
        # pipefail matters here: GitHub's default shell is `bash -e`, not
        # `bash -eo pipefail`, so without it `tee` would mask the eval's exit
        # code -- both a threshold breach and an outright crash -- and the
        # step would pass green.
        run: |
          set -o pipefail
          uv run python -m evals.eval_linter --min-f1 0.95 | tee eval_output.txt

      # Report only: the held-out set is written independently of the linter,
      # so it is a generalisation check rather than a gate. A drop here is
      # worth seeing but should not block a merge on its own. `if: always()`
      # so it still runs when the gated main-set step above fails.
      - name: Run linter eval -- held-out set (report only)
        id: eval_holdout
        if: always() && steps.eval.outcome != 'skipped'
        run: |
          set -o pipefail
          uv run python -m evals.eval_linter             --golden evals/golden_linter_holdout.json | tee eval_holdout_output.txt

      # The retrieval eval queries the real ChromaDB store, which a fresh
      # checkout does not have. pytest seeds only throwaway tmp directories, so
      # seed the configured store explicitly before evaluating against it.
      - name: Seed ChromaDB for the retrieval eval
        if: always() && steps.eval.outcome != 'skipped'
        run: uv run python -m app.seed_cases

      # Gate: retrieval must keep finding the right seed case. 1.0 is the
      # measured hit rate@3, and the similarity threshold in config is
      # calibrated to sit just under the worst correct score, so a regression
      # here means either retrieval quality or that calibration has drifted.
      - name: Run retrieval eval (gated at hit rate@3 1.0)
        id: eval_retrieval
        if: always() && steps.eval.outcome != 'skipped'
        run: |
          set -o pipefail
          uv run python -m evals.eval_retrieval --min-hit-rate 1.0 | tee eval_retrieval_output.txt

      # Report only: the same eval without the lint rule names in the search
      # text. This is the weaker shape the MCP tool used before calibration;
      # keeping it visible shows what that change is worth over time.
      - name: Run retrieval eval -- query only (report only)
        id: eval_retrieval_query_only
        if: always() && steps.eval.outcome != 'skipped'
        run: |
          set -o pipefail
          uv run python -m evals.eval_retrieval --query-only | tee eval_retrieval_query_only_output.txt

      # Gate: the verification agent must get all six rewrite verdicts right
      # using the deterministic oracle alone. --no-llm is not a concession to
      # CI having no GROQ_API_KEY, it is the stronger assertion: every wrong
      # rewrite in the golden set should be caught by executing both queries
      # and comparing results, with no model involved. If this ever needs the
      # LLM to pass, the fixture has stopped containing the rows that expose a
      # case, and that is exactly the regression worth blocking a merge on.
      #
      # The live run (same command without --no-llm) exercises the Groq
      # tool-calling loop and has to be run by hand with a key; its result is
      # committed as evals/results/verifier_baseline.json.
      - name: Run verifier eval -- deterministic oracle (gated at 100%)
        id: eval_verifier
        if: always() && steps.eval.outcome != 'skipped'
        run: |
          set -o pipefail
          uv run python -m evals.eval_verifier --no-llm --min-accuracy 1.0 | tee eval_verifier_output.txt

      - name: Add eval results to job summary
        if: always() && steps.eval.outcome != 'skipped'
        run: |
          {
            echo '## Linter eval -- main set (gated, F1 >= 0.95)'
            echo '```'
            cat eval_output.txt || echo 'eval produced no output'
            echo '```'
            echo '## Linter eval -- held-out set (report only)'
            echo '```'
            cat eval_holdout_output.txt || echo 'held-out eval produced no output'
            echo '```'
            echo '## Retrieval eval (gated, hit rate@3 = 1.0)'
            echo '```'
            cat eval_retrieval_output.txt || echo 'retrieval eval produced no output'
            echo '```'
            echo '## Retrieval eval -- query only, no lint rule names (report only)'
            echo '```'
            cat eval_retrieval_query_only_output.txt || echo 'query-only eval produced no output'
            echo '```'
            echo '## Verifier eval -- deterministic oracle (gated, accuracy = 1.0)'
            echo '```'
            cat eval_verifier_output.txt || echo 'verifier eval produced no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload eval result JSON
        if: always() && steps.eval.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            backend/evals/results/linter_latest.json
            backend/evals/results/linter_latest_holdout.json
            backend/evals/results/retrieval_latest.json
            backend/evals/results/retrieval_latest_query_only.json
            backend/evals/results/verifier_latest_no_llm.json
          if-no-files-found: warn
